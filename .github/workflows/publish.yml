name: Publish

# Publishing is driven by GitHub Releases: bump the version, tag it, publish the
# release, and this pushes it to npm. workflow_dispatch is here so a failed run
# can be retried without cutting a second release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and for provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run check

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Provenance ties the published tarball to this workflow run, but npm only
      # accepts it from a public repository. Skip it while the repo is private
      # rather than failing the publish.
      - name: Publish to npm
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Repository is private; publishing without provenance."
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
